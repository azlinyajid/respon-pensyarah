<!DOCTYPE html>
<html lang="ms"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard OS</title>
<script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script></head>
<body class="bg-slate-100"><div class="max-w-7xl mx-auto p-6">
<div class="bg-gradient-to-r from-blue-800 to-blue-500 text-white p-6 rounded-2xl mb-6"><h1 class="text-3xl font-bold">Dashboard Kefahaman Operating System</h1><p>Auto baca CSV daripada GitHub</p></div>
<div class="grid md:grid-cols-4 gap-4 mb-6">
<div class="bg-white p-4 rounded-xl shadow"><div>Responden</div><div id=r class='text-3xl font-bold'>-</div></div>
<div class="bg-white p-4 rounded-xl shadow"><div>% Faham</div><div id=f class='text-3xl font-bold text-green-600'>-</div></div>
<div class="bg-white p-4 rounded-xl shadow"><div>% Intervensi</div><div id=i class='text-3xl font-bold text-red-600'>-</div></div>
<div class="bg-white p-4 rounded-xl shadow"><div>Purata</div><div id=a class='text-3xl font-bold text-blue-600'>-</div></div></div>
<div class='grid lg:grid-cols-2 gap-6'>
<div class='bg-white p-4 rounded-xl shadow'><canvas id='donut'></canvas></div>
<div class='bg-white p-4 rounded-xl shadow'><h3 class='font-bold mb-2'>Rumusan</h3><div id='summary'></div></div></div>
<div class='bg-white p-4 rounded-xl shadow mt-6'><canvas id='bar'></canvas></div>
<div class='bg-white p-4 rounded-xl shadow mt-6'><h3 class='font-bold mb-2'>Komen Pelajar</h3><div id='comments'></div></div>
</div>
<script>
const csvFile='./Kefahaman Operating System.csv';
Papa.parse(csvFile,{download:true,header:true,complete:(res)=>{
const d=res.data.filter(x=>Object.keys(x).length>1);
const topics=['Saya memahami fungsi Operating System','Saya memahami Process dan Program','Saya memahami CPU Scheduling','Saya memahami Memory Management','Saya yakin menjawab soalan topik ini'];
let faham=0,inter=0,total=0;let pct=[];
const respondent=d.length;
let allscores=[];
topics.forEach(t=>{let ok=0,c=0;d.forEach(r=>{let v=parseInt(r[t]);if(!isNaN(v)){c++;allscores.push(v);total++; if(v>=3){faham++;ok++;}else{inter++;}}}); pct.push(c?Math.round(ok/c*100):0);});
const avg=(allscores.reduce((a,b)=>a+b,0)/Math.max(1,allscores.length)).toFixed(2);
document.getElementById('r').textContent=respondent;document.getElementById('f').textContent=Math.round(faham/Math.max(1,total)*100)+'%';document.getElementById('i').textContent=Math.round(inter/Math.max(1,total)*100)+'%';document.getElementById('a').textContent=avg+'/4';
let maxI=pct.indexOf(Math.max(...pct)), minI=pct.indexOf(Math.min(...pct));
document.getElementById('summary').innerHTML=`<div class='bg-blue-50 p-3 rounded'>${Math.round(faham/Math.max(1,total)*100)}% pelajar berada dalam kategori faham.<br>Topik terbaik: <b>${topics[maxI]}</b><br>Topik perlu perhatian: <b>${topics[minI]}</b></div>`;
new Chart(document.getElementById('donut'),{type:'doughnut',data:{labels:['Faham','Intervensi'],datasets:[{data:[faham,inter],backgroundColor:['#2563eb','#ef4444']}]}});
new Chart(document.getElementById('bar'),{type:'bar',data:{labels:['Fungsi OS','Process & Program','CPU Scheduling','Memory','Keyakinan'],datasets:[{data:pct,backgroundColor:'#2563eb'}]},options:{indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{min:0,max:100}}}});
const c=document.getElementById('comments'); d.forEach(r=>{let txt=r['Cadangan atau komen untuk membantu meningkatkan kefahaman anda.']; if(txt) c.innerHTML+=`<div class='border p-2 rounded mb-2'>${txt}</div>`;});
},error:()=>{document.body.innerHTML='<h2>Sila muat naik fail CSV ke repository GitHub.</h2>'}});
</script></body></html>
